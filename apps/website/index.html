<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 跟随系统深浅色偏好，渲染前同步 class 避免 FOUC
      ;(() => {
        const sync = () => {
          document.documentElement.classList.toggle(
            'dark',
            window.matchMedia('(prefers-color-scheme: dark)').matches,
          )
        }
        sync()
        window
          .matchMedia('(prefers-color-scheme: dark)')
          .addEventListener('change', sync)
      })()
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='7' height='7'/%3E%3Crect x='17' width='7' height='7'/%3E%3Crect x='17' y='17' width='7' height='7'/%3E%3Crect y='17' width='7' height='7'/%3E%3Crect x='9' y='9' width='7' height='7'/%3E%3Crect x='3' y='3' width='4' height='4' fill='white'/%3E%3C/svg%3E"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Zero-dependency QR Code encoder with SVG / Canvas / PNG / Terminal renderers, plus an online QR tool with history."
    />
    <title>QRCode Encoder</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
